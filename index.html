<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>家計簿</title>

  <!-- 検索エンジン除外（インデックス・キャッシュ防止） -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive">

  <!-- PWA設定 -->
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/0f766e/ffffff?text=家計簿">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .fade-in {
      animation: fadeIn 0.18s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen">

  <!-- アプリメイン枠（スマホ縦持ち最適化） -->
  <div class="w-full max-w-md h-[100dvh] flex flex-col bg-white shadow-2xl relative overflow-hidden">

    <!-- 1. トップヘッダー -->
    <header class="bg-teal-700 text-white px-4 py-3 shadow-sm flex items-center justify-between z-10 shrink-0">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-book-bookmark text-teal-200 text-lg"></i>
        <h1 class="text-base font-bold tracking-tight">家計簿</h1>
      </div>
      <div class="flex items-center space-x-2 text-xs">
        <span id="header-cycle-badge" class="bg-teal-800/80 text-teal-100 px-2.5 py-0.5 rounded-full font-medium"></span>
      </div>
    </header>

    <!-- 2. コンテンツエリア（タブ切替） -->
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-20 bg-slate-50 relative">

      <!-- ================= 1. ダッシュボード・入力 タブ ================= -->
      <section id="tab-input" class="p-4 space-y-4 fade-in">
        <!-- 予算プログレスカード -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span>
              <span class="text-xs font-bold text-slate-500" id="dash-cycle-label">今月の予算状況</span>
            </div>
            <span id="dash-days-left-badge" class="text-[10px] bg-teal-50 text-teal-700 font-bold px-2 py-0.5 rounded-full border border-teal-200">残り--日</span>
          </div>

          <!-- 祝日調整注記 -->
          <div id="dash-cycle-adjustment-note" class="hidden text-[10px] bg-amber-50 text-amber-800 px-2.5 py-1.5 rounded-xl border border-amber-200/70 flex items-center space-x-1.5">
            <i class="fa-solid fa-calendar-check text-amber-600"></i>
            <span id="dash-cycle-adjustment-text" class="font-bold"></span>
          </div>

          <div>
            <div class="flex justify-between items-baseline mb-1">
              <div class="text-xs text-slate-400">支出額 / 予算</div>
              <div class="text-right">
                <span id="dash-spent-amount" class="text-xl font-black text-slate-800">¥0</span>
                <span id="dash-budget-amount" class="text-xs text-slate-400 font-medium"> / ¥100,000</span>
              </div>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
              <div id="dash-budget-bar" class="bg-teal-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-50 text-center">
            <div class="p-2 rounded-xl bg-slate-50">
              <div class="text-[10px] text-slate-400 font-bold">残りの予算</div>
              <div id="dash-remain-budget" class="text-sm font-black text-teal-700">¥0</div>
            </div>
            <div class="p-2 rounded-xl bg-slate-50">
              <div class="text-[10px] text-slate-400 font-bold">1日あたりの目安</div>
              <div id="dash-daily-allowance" class="text-sm font-black text-slate-700">¥0/日</div>
            </div>
          </div>
        </div>

        <!-- 収支切替トグル -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-200 rounded-xl">
          <button id="type-expense-btn" onclick="setInputType('expense')" class="py-2 text-center font-bold text-xs rounded-lg bg-teal-700 text-white shadow-xs transition">
            支出
          </button>
          <button id="type-income-btn" onclick="setInputType('income')" class="py-2 text-center font-bold text-xs rounded-lg text-slate-600 transition">
            収入
          </button>
        </div>

        <!-- レシート撮影バナー（支出時のみ） -->
        <div id="receipt-scan-banner" class="bg-gradient-to-r from-teal-700 to-emerald-600 rounded-2xl p-3.5 text-white shadow-sm flex items-center justify-between">
          <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-sm shrink-0">
              <i class="fa-solid fa-camera"></i>
            </div>
            <div>
              <div class="text-xs font-bold">レシート読取 (Gemini AI)</div>
              <div class="text-[10px] text-teal-100">品目・個別カテゴリ・金額を一括自動入力</div>
            </div>
          </div>
          <input type="file" id="receipt-input" accept="image/*" capture="environment" class="hidden" onchange="handleReceiptUpload(event)">
          <button onclick="document.getElementById('receipt-input').click()" class="bg-white text-teal-800 font-bold text-xs px-3.5 py-2 rounded-xl shadow active:scale-95 transition shrink-0">
            撮影する
          </button>
        </div>

        <!-- 入力フォーム本体 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
          <!-- 日付 & 支払元 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-slate-400 block mb-1">日付</label>
              <input type="date" id="form-date" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 font-bold">
            </div>
            <div>
              <label class="text-[10px] font-bold text-slate-400 block mb-1">支払い元 / 口座</label>
              <select id="form-payment-method" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 font-bold">
                <!-- JS生成 -->
              </select>
            </div>
          </div>

          <!-- 店舗・電話番号検索 -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-[10px] font-bold text-slate-400">店名 / 電話番号検索</label>
              <span class="text-[10px] text-teal-600">電話番号で店名自動特定</span>
            </div>
            <div class="flex space-x-2">
              <div class="relative flex-1">
                <input type="text" id="form-store" placeholder="例: 03-1234-5678 または マツモトキヨシ" class="w-full pl-3 pr-7 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500">
                <button type="button" onclick="document.getElementById('form-store').value=''" class="absolute right-2 top-2 text-slate-300 hover:text-slate-500 text-xs">
                  <i class="fa-solid fa-circle-xmark"></i>
                </button>
              </div>
              <button type="button" onclick="searchStore()" class="px-3 py-2 bg-slate-100 hover:bg-teal-50 text-teal-700 font-bold text-xs rounded-xl border border-slate-200 transition shrink-0 flex items-center space-x-1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>検索</span>
              </button>
            </div>
          </div>

          <!-- 集計対象（常に含む / 年別のみ / 集計除外） -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-[10px] font-bold text-slate-400">集計対象</label>
              <button type="button" onclick="openModal('inclusion-help-modal')" class="text-[10px] text-teal-600 underline">違いについて</button>
            </div>
            <div class="grid grid-cols-3 gap-1 p-1 bg-slate-
